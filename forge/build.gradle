plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = "${forge_mc_version}-${mod_version}-forge"

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

sourceSets.main.java.srcDirs += ['../src/main/java']
sourceSets.main.resources.srcDirs += ['../src/main/resources']

minecraft {
    mappings channel: 'official', version: forge_mc_version

    runs {
        client {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${forge_mc_version}-${forge_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        minecraft_version: forge_mc_version,
        minecraft_version_range: forge_mc_version_range,
        forge_version: forge_version,
        forge_version_range: forge_version_range,
        loader_version_range: forge_loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: "${forge_mc_version}-${mod_version}",
        mod_authors: mod_authors,
        mod_description: mod_description,
        pack_format: 15
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
            "Specification-Title": mod_name,
            "Specification-Vendor": "MiXiaoAi",
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": "${forge_mc_version}-${mod_version}",
            "Implementation-Vendor": "MiXiaoAi",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')
