name: Continuous Integration

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build with Gradle
      run: ./gradlew clean build --no-daemon
      
    - name: Get version info
      id: version
      run: |
        VERSION=$(grep "mod_version=" gradle.properties | cut -d'=' -f2)
        FORGE_MC=$(grep "forge_mc_version=" gradle.properties | cut -d'=' -f2)
        NEOFORGE_MC=$(grep "neoforge_mc_version=" gradle.properties | cut -d'=' -f2)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "forge_jar=auto_shutdown-$FORGE_MC-$VERSION-forge.jar" >> $GITHUB_OUTPUT
        echo "neoforge_jar=auto_shutdown-$NEOFORGE_MC-$VERSION-neoforge.jar" >> $GITHUB_OUTPUT
        
    - name: Upload Forge build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: AutoShutdown-${{ steps.version.outputs.forge_jar }}-build-${{ github.run_number }}
        path: forge/build/libs/auto_shutdown-*.jar
        retention-days: 7
        
    - name: Upload NeoForge build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: AutoShutdown-${{ steps.version.outputs.neoforge_jar }}-build-${{ github.run_number }}
        path: neoforge/build/libs/auto_shutdown-*.jar
        retention-days: 7
        
    - name: Build status
      run: |
        echo "✅ Build completed successfully!"
        echo "📦 Version: ${{ steps.version.outputs.version }}"
        echo "🔨 Build number: ${{ github.run_number }}"
        ls -la forge/build/libs/ neoforge/build/libs/