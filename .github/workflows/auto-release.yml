name: Auto Build & Release

on:
  push:
    branches: [ master, main ]
    paths:
      - 'src/**'
      - 'forge/**'
      - 'neoforge/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Auto-increment version
      id: version
      run: |
        VERSION=$(grep "^mod_version=" gradle.properties | cut -d'=' -f2)
        MAJOR=${VERSION%%.*}
        REST=${VERSION#*.}
        MINOR=${REST%%.*}
        PATCH=${REST##*.}
        NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
        echo "Bumping version: $VERSION -> $NEW_VERSION"
        sed -i "s/^mod_version=.*/mod_version=$NEW_VERSION/" gradle.properties
        echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
        FORGE_MC=$(grep "^forge_mc_version=" gradle.properties | cut -d'=' -f2)
        NEOFORGE_MC=$(grep "^neoforge_mc_version=" gradle.properties | cut -d'=' -f2)
        echo "forge_jar=auto_shutdown-$FORGE_MC-$NEW_VERSION-forge.jar" >> $GITHUB_OUTPUT
        echo "neoforge_jar=auto_shutdown-$NEOFORGE_MC-$NEW_VERSION-neoforge.jar" >> $GITHUB_OUTPUT

    - name: Build with Gradle
      run: ./gradlew clean build --no-daemon

    - name: Verify build output
      run: |
        ls -la forge/build/libs/ neoforge/build/libs/
        if [ ! -f "forge/build/libs/${{ steps.version.outputs.forge_jar }}" ]; then
          echo "Build failed: Forge JAR file not found"
          exit 1
        fi
        if [ ! -f "neoforge/build/libs/${{ steps.version.outputs.neoforge_jar }}" ]; then
          echo "Build failed: NeoForge JAR file not found"
          exit 1
        fi

    - name: Commit version bump and push tag
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add gradle.properties
        git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
        BRANCH="${GITHUB_REF#refs/heads/}"
        git push origin "HEAD:$BRANCH"
        git tag "v${{ steps.version.outputs.version }}"
        git push origin "v${{ steps.version.outputs.version }}"

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: Auto Shutdown v${{ steps.version.outputs.version }}
        generate_release_notes: true
        body: |
          ## Auto Shutdown v${{ steps.version.outputs.version }}

          ### 📦 Downloads
          - **Forge (MC 1.20.1)**: `${{ steps.version.outputs.forge_jar }}`
          - **NeoForge (MC 1.21.1)**: `${{ steps.version.outputs.neoforge_jar }}`

          ### 📖 Changelog
          See [CHANGELOG.md](https://github.com/MiXiaoAi/AutoShutdown/blob/master/CHANGELOG.md)
        draft: false
        prerelease: false
        files: |
          forge/build/libs/${{ steps.version.outputs.forge_jar }}
          neoforge/build/libs/${{ steps.version.outputs.neoforge_jar }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
