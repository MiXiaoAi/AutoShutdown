plugins {
    id 'net.neoforged.moddev' version '2.0.143'
}

version = "${neoforge_mc_version}-${mod_version}-neoforge"

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

sourceSets.main.java.srcDirs += ['../src/main/java']
sourceSets.main.resources.srcDirs += ['../src/main/resources']

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
        }

        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        minecraft_version: neoforge_mc_version,
        minecraft_version_range: neoforge_mc_version_range,
        neoforge_version: neoforge_version,
        neoforge_version_range: neoforge_version_range,
        loader_version_range: neoforge_loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: "${neoforge_mc_version}-${mod_version}",
        mod_authors: mod_authors,
        mod_description: mod_description,
        pack_format: 34
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
            "Specification-Title": mod_name,
            "Specification-Vendor": "MiXiaoAi",
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": "${neoforge_mc_version}-${mod_version}",
            "Implementation-Vendor": "MiXiaoAi",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
